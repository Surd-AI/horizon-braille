<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Horizon Braille — From expressions to accessible text</title>
  <desc id="desc">An open-source TypeScript braille engine for Chinese, mathematics and chemistry, with source alignment and page layout.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102b38"/><stop offset="1" stop-color="#0d171e"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#7de9cd"/><stop offset="1" stop-color="#92cfff"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#b4d6de" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1200" height="400" rx="22" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="22" fill="url(#grid)"/>
  <path d="M0 345 Q370 240 720 330 T1200 260" fill="none" stroke="url(#accent)" stroke-opacity=".22"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="64" y="74" fill="#7de9cd" font-size="13" letter-spacing="4">OPEN SOURCE · BUILT FOR ACCESSIBILITY</text>
    <text x="60" y="150" fill="#f1f8fa" font-size="64" font-weight="700" letter-spacing="-2">Horizon Braille</text>
    <text x="64" y="197" fill="#b3c9d2" font-size="23">From expressions to accessible text.</text>
    <text x="64" y="239" fill="#8aa8b6" font-size="17">Chinese · Mathematics · Chemistry · Page layout</text>
    <g font-size="13" fill="#d6eeea">
      <rect x="64" y="280" width="106" height="32" rx="16" fill="#173e43"/><text x="85" y="301">TypeScript</text>
      <rect x="180" y="280" width="116" height="32" rx="16" fill="#173e43"/><text x="200" y="301">Offline core</text>
      <rect x="306" y="280" width="121" height="32" rx="16" fill="#173e43"/><text x="325" y="301">Apache-2.0</text>
    </g>
    <text x="64" y="365" fill="#7895a3" font-size="12" letter-spacing="2">PARSE → ENCODE → LAYOUT → REVIEW</text>
    <rect x="808" y="64" width="326" height="269" rx="20" fill="#152d38" stroke="#34505c"/>
    <text x="834" y="99" fill="#95b6c3" font-size="11" letter-spacing="1.5">SIX DOTS. MORE POSSIBILITIES.</text>
    <g fill="#7de9cd">
      <circle cx="862" cy="151" r="11"/><circle cx="862" cy="184" r="11"/><circle cx="895" cy="184" r="11"/>
      <circle cx="955" cy="151" r="11"/><circle cx="955" cy="184" r="11"/><circle cx="955" cy="217" r="11"/>
      <circle cx="1048" cy="151" r="11"/><circle cx="1048" cy="184" r="11"/><circle cx="1081" cy="151" r="11"/><circle cx="1081" cy="217" r="11"/>
    </g>
    <g fill="#294652">
      <circle cx="895" cy="151" r="11"/><circle cx="862" cy="217" r="11"/><circle cx="895" cy="217" r="11"/>
      <circle cx="988" cy="151" r="11"/><circle cx="988" cy="184" r="11"/><circle cx="988" cy="217" r="11"/>
      <circle cx="1048" cy="217" r="11"/><circle cx="1081" cy="184" r="11"/>
    </g>
    <path d="M834 251H1108" stroke="#34505c"/>
    <text x="834" y="281" fill="#e5f2f5" font-size="15">Unicode / BRF / Source mappings</text>
    <text x="834" y="307" fill="#88a8b6" font-size="13">Your interface. Your workflow.</text>
  </g>
